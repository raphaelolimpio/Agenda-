<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine do estabelecimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="api.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="text-sm font-bold text-slate-600 hover:text-blue-600">← Explorar estabelecimentos</a>
            <div class="flex items-center gap-4">
                <a href="entrar.html?tipo=cliente" class="text-sm font-bold text-slate-600 hover:text-blue-600">Entrar</a>
                <a id="linkAgendamentoTopo" href="agendar.html" class="text-sm font-bold text-blue-600">Agendar</a>
            </div>
        </div>
    </header>

    <section id="vitrineBanner" class="store-banner store-hero h-56 sm:h-80 w-full" aria-label="Imagem de apresentação"></section>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 pb-12 relative -mt-12 sm:-mt-16">
        <section class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 sm:p-9">
            <div class="flex flex-col sm:flex-row sm:items-end gap-5">
                <img id="vitrineLogo" alt="" class="hidden w-24 h-24 rounded-2xl border-4 border-white shadow-lg object-cover bg-white -mt-16">
                <div class="flex-1">
                    <span id="vitrineSegmento" class="text-xs font-bold uppercase tracking-widest text-blue-600">Estabelecimento</span>
                    <h1 id="vitrineNome" class="font-bold text-3xl sm:text-4xl text-slate-900 mt-2">Carregando...</h1>
                </div>
                <a id="linkAgendamento" href="agendar.html" class="brand-accent w-full sm:w-auto px-7 py-3.5 text-white rounded-xl text-sm font-bold shadow-lg transition text-center">
                    Agendar atendimento
                </a>
            </div>
            <p id="vitrineDescricao" class="text-sm sm:text-base text-slate-600 mt-6 max-w-3xl leading-relaxed"></p>
        </section>

        <section class="mt-10">
            <div class="flex items-end justify-between gap-4 mb-5">
                <div>
                    <p class="text-xs font-bold uppercase tracking-[0.15em] text-blue-600">Feito para você</p>
                    <h2 class="font-bold text-2xl text-slate-900 mt-1">Serviços disponíveis</h2>
                </div>
                <span id="totalServicos" class="text-xs text-slate-500"></span>
            </div>
            <div id="listaServicos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="loading-state sm:col-span-2 lg:col-span-3">Carregando serviços...</div>
            </div>
        </section>
        <p id="vitrineErro" class="status-message mt-5" role="status" aria-live="polite"></p>
    </main>
    <script>
        (function () {
            const spaceId = AppApi.getSpaceId();
            const money = (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(value) || 0);

            async function carregarVitrine() {
                const error = document.getElementById('vitrineErro');
                try {
                    const [store, services] = await Promise.all([
                        AppApi.request(`/espacos/${encodeURIComponent(spaceId)}/vitrine`),
                        AppApi.request(`/espacos/${encodeURIComponent(spaceId)}/servicos`)
                    ]);
                    AppApi.request('/api/customer/recent-visits', {
                        method: 'POST',
                        body: JSON.stringify({ space_id: spaceId })
                    }).catch((visitError) => {
                        if (visitError.status !== 401) console.error('Não foi possível registrar a visita:', visitError);
                    });

                    AppApi.applyBrandTheme(store);
                    document.title = `${store.nome} | Agenda+`;
                    document.getElementById('vitrineNome').textContent = store.nome;
                    document.getElementById('vitrineSegmento').textContent = store.segmento || store.nicho || 'Serviços';
                    document.getElementById('vitrineDescricao').textContent = store.descricao || 'Conheça nossos serviços e agende seu próximo atendimento.';
                    const banner = AppApi.getImageUrl(store.banner_url);
                    if (banner) document.getElementById('vitrineBanner').style.backgroundImage = `url("${banner.replace(/["\\]/g, '\\$&')}")`;

                    const logo = AppApi.getImageUrl(store.logo_url);
                    if (logo) {
                        const logoElement = document.getElementById('vitrineLogo');
                        logoElement.src = logo;
                        logoElement.classList.remove('hidden');
                    }

                    const bookingUrl = `agendar.html?loja=${encodeURIComponent(spaceId)}`;
                    document.getElementById('linkAgendamento').href = bookingUrl;
                    document.getElementById('linkAgendamentoTopo').href = bookingUrl;

                    const serviceList = document.getElementById('listaServicos');
                    document.getElementById('totalServicos').textContent = `${services.length} ${services.length === 1 ? 'serviço' : 'serviços'}`;
                    if (services.length === 0) {
                        serviceList.innerHTML = '<div class="empty-state sm:col-span-2 lg:col-span-3">Este estabelecimento ainda não publicou serviços.</div>';
                        return;
                    }

                    serviceList.innerHTML = services.map((service) => `
                        <article class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                            <span class="text-xs font-semibold uppercase tracking-wide text-blue-600">${AppApi.escapeHtml(service.categoria || 'Atendimento')}</span>
                            <h3 class="mt-2 text-lg font-bold text-slate-900">${AppApi.escapeHtml(service.nome)}</h3>
                            <div class="mt-4 flex items-center justify-between text-sm">
                                <span class="text-slate-500">${Number(service.duracao_minutos) || 0} min</span>
                                <strong class="text-slate-900">${money(service.preco)}</strong>
                            </div>
                        </article>
                    `).join('');
                } catch (loadError) {
                    error.textContent = loadError.message;
                    document.getElementById('listaServicos').innerHTML = '<div class="empty-state sm:col-span-2 lg:col-span-3">Não foi possível carregar os dados deste estabelecimento.</div>';
                }
            }

            carregarVitrine();
        })();
    </script>
</body>
</html>
